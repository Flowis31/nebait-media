<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>short</title>
<style>
@font-face{font-family:Unb;src:url(fonts/Unb.ttf);font-weight:200 900}
@font-face{font-family:PF;src:url(fonts/PF.ttf);font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(fonts/PFi.ttf);font-weight:400 900;font-style:italic}
@font-face{font-family:JB;src:url(fonts/JB.ttf);font-weight:100 800}
@font-face{font-family:Mont;src:url(fonts/Mont.ttf);font-weight:100 900}
:root{--ink:#0a130d;--bg:#081430;--acc:#ffb52e;--accd:#c97f10;--paper:#f4ecd9;--red:#ff3b5c;--dim:#8fa6c8;--cy:#43e8ff;--pk:#ff5fa2;--gr:#7dff8a;--yl:#ffe14d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Mont;color:var(--paper)}
/* world: night radio highway */
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#050c20 0%,#0b1d3f 34%,#14407a 54%,#1f7396 61.2%,#0a1630 61.6%,#070f22 100%)}
#stars{position:absolute;left:-600px;top:0;width:2400px;height:1100px;will-change:transform}
#city{position:absolute;left:-700px;top:480px;width:3400px;height:700px;will-change:transform}
#towers{position:absolute;left:-700px;top:120px;width:3400px;height:1100px;will-change:transform}
#road{position:absolute;left:0;top:1180px;width:1080px;height:740px;background:linear-gradient(180deg,#132447 0%,#0b1630 30%,#070f22 100%)}
#dashes{position:absolute;left:-700px;top:1196px;width:3400px;height:700px;will-change:transform}
.blob{position:absolute;width:1240px;height:1240px;border-radius:50%;will-change:transform}
#blob1{left:-500px;top:-120px;background:radial-gradient(closest-side,rgba(67,232,255,.12) 0%,rgba(67,232,255,.04) 45%,rgba(67,232,255,0) 100%)}
#blob2{left:320px;top:860px;background:radial-gradient(closest-side,rgba(255,181,46,.10) 0%,rgba(255,181,46,.03) 45%,rgba(255,181,46,0) 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(90% 62% at 50% 46%,transparent 55%,rgba(0,4,16,.6) 100%)}
#shake{position:absolute;inset:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 860px;will-change:transform}
.scene *{position:absolute}
#cap{position:absolute;left:90px;top:1338px;width:900px;height:240px}
.chunk{position:absolute;left:0;top:0;width:900px;text-align:center;font:900 80px/1.06 Mont;text-transform:uppercase;letter-spacing:-1px;display:none;transform-origin:50% 40%}
.chunk span{display:inline-block;margin:0 11px;color:#fff;-webkit-text-stroke:18px #040705;paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.55)}
.chunk span.on{color:var(--acc)}
/* shared */
.cam{left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.nb-panel{border-left-color:var(--acc);border-color:rgba(255,181,46,.4);background:linear-gradient(180deg,rgba(14,30,64,.95),rgba(7,16,38,.95))}
.nb-panel.red{border-left-color:var(--red);border-color:rgba(255,59,92,.4)}
.nb-chip{border-color:rgba(255,181,46,.75);background:rgba(8,18,42,.93)}
.nb-chip.c{border-color:rgba(67,232,255,.8)}.nb-chip.r{border-color:rgba(255,59,92,.85)}.nb-chip.g{border-color:rgba(125,255,138,.85)}
.chipL{height:96px;padding:0 44px;font:700 46px/90px JB;letter-spacing:4px;color:var(--acc);text-align:center;white-space:nowrap}
.chipL.c{color:var(--cy)}.chipL.r{color:#ff7a90}.chipL.g{color:var(--gr)}
.panT{padding:18px 40px 20px 46px;font:800 36px/1.3 Mont;color:var(--paper);white-space:nowrap}
.panT b{position:static;color:var(--acc);font-weight:900}
.big{font:900 150px/1 Unb;color:#fff;-webkit-text-stroke:16px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.big i{position:static;font-style:normal;color:var(--acc)}
.lbl{font:900 80px/1 Unb;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.lbl i{position:static;font-style:normal;color:var(--acc)}
.shd{border-radius:50%;background:radial-gradient(closest-side,rgba(0,4,16,.7),rgba(0,4,16,0));transform-origin:center}
.stt{border-radius:30px;text-align:center;background:rgba(6,14,32,.94);white-space:nowrap}
.conf{width:18px;height:28px;border-radius:4px}
.spark{width:36px;height:36px;background:#ffe14d;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.crumb{width:20px;height:20px;border-radius:5px;background:#ff3b5c;border:4px solid var(--ink)}
.qm{font:900 120px/1 Unb;color:var(--yl);-webkit-text-stroke:12px var(--ink);paint-order:stroke fill}
.ring{border:10px solid #fff;border-radius:50%}
.flash{left:0;top:0;width:1080px;height:1920px;background:#fff}
/* lane boards (the radio highway seen from above) */
.lanebox{border-radius:36px;overflow:hidden;background:#0b1630;box-shadow:0 0 0 10px var(--ink),0 0 0 16px rgba(255,255,255,.07),0 40px 90px rgba(0,0,0,.55)}
.ln{top:0;transform-origin:50% 100%}
.lhl{top:0;opacity:0;background:linear-gradient(180deg,rgba(255,181,46,.05),rgba(255,181,46,.62) 50%,rgba(255,181,46,.05))}
.lsep{top:-140px;width:8px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.34) 0 50px,transparent 50px 140px);will-change:transform}
.zone{top:0;opacity:0;transform-origin:50% 0}
.zone.wf{background:repeating-linear-gradient(135deg,rgba(255,138,46,.78) 0 22px,rgba(255,181,46,.5) 22px 44px)}
.zone.mw{background:repeating-linear-gradient(45deg,rgba(255,59,92,.8) 0 22px,rgba(255,110,130,.5) 22px 44px)}
.dot{border-radius:50%;border:5px solid var(--ink)}
.bar{border-radius:14px;border:7px solid var(--ink);background:linear-gradient(180deg,#b6ffbe,#3fd65e);transform-origin:50% 100%}
.blk{border-radius:22px;border:9px solid var(--ink);background:linear-gradient(180deg,#b6ffbe,#3fd65e);box-shadow:inset 0 10px 0 rgba(255,255,255,.35);transform-origin:50% 100%}
.trail{border-radius:50%;background:var(--gr);border:4px solid var(--ink)}
.wave{border:8px solid #ff5f7a;border-radius:50%;opacity:0}
</style></head>
<body>
<div id="stage">
  <div id="bg"><div id="stars"></div><div id="city"></div><div id="towers"></div><div id="road"></div><div id="dashes"></div><div class="blob" id="blob1"></div><div class="blob" id="blob2"></div></div>
  <div id="shake">
<div id="A" class="scene"><div class="cam"></div></div>
<div id="B" class="scene"><div class="cam"></div></div>
<div id="C" class="scene"><div class="cam"></div></div>
<div id="D" class="scene"><div class="cam"></div></div>
<div id="E" class="scene"><div class="cam"></div></div>
<div id="F" class="scene"><div class="cam"></div></div>
<div id="G" class="scene"><div class="cam"></div></div>
<div id="H" class="scene"><div class="cam"></div></div>
<div id="J" class="scene"><div class="cam"></div></div>
<div id="V" class="scene"><div class="cam"></div></div>
<div id="A2" class="scene"><div class="cam"></div></div>
  </div>
  <div id="vig"></div>
  <div id="cap"></div>
</div>
<script src="timing.js"></script>
<script src="env.js"></script>
<script src="engine.js"></script>
<script src="mascot.js"></script>
<script src="props.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
</body></html>
