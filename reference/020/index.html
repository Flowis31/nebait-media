<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>short</title>
<style>
@font-face{font-family:Unb;src:url(fonts/Unb.ttf);font-weight:200 900}
@font-face{font-family:PF;src:url(fonts/PF.ttf);font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(fonts/PFi.ttf);font-weight:400 900;font-style:italic}
@font-face{font-family:JB;src:url(fonts/JB.ttf);font-weight:100 800}
@font-face{font-family:Mont;src:url(fonts/Mont.ttf);font-weight:100 900}
:root{--ink:#0a130d;--bg:#2b1424;--acc:#b8ff3d;--accd:#74c81c;--paper:#f4ecd9;--red:#ff3b5c;--dim:#8fa698;--line:#24382c;--amb:#ffb84d;--mus:#ffd34d;--ket:#ff4d5e;--cy:#5fe0ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Mont;color:var(--paper)}
/* world: a night street by a burger diner — skyline (far), diner facade (mid), street lamps (near), sidewalk */
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#1c0c22 0%,#2b1424 45%,#3a1a26 100%)}
#sky{position:absolute;left:0;top:0;width:4800px;height:700px;will-change:transform}
#diner{position:absolute;left:-700px;top:120px;width:3400px;height:1300px;will-change:transform}
#walk{position:absolute;left:-700px;top:1240px;width:3400px;height:700px;will-change:transform;background:linear-gradient(180deg,#4a2430,#22101a)}
#walk:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 8px,transparent 8px 240px)}
#street{position:absolute;left:-700px;top:60px;width:3400px;height:1300px;will-change:transform;opacity:.95}
.blob{position:absolute;width:1240px;height:1240px;border-radius:50%;will-change:transform}
#blob1{left:-500px;top:-120px;background:radial-gradient(closest-side,rgba(255,184,77,.16) 0%,rgba(255,184,77,.05) 45%,rgba(255,184,77,0) 100%)}
#blob2{left:320px;top:860px;background:radial-gradient(closest-side,rgba(255,77,94,.12) 0%,rgba(255,77,94,.04) 45%,rgba(255,77,94,0) 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(90% 62% at 50% 46%,transparent 55%,rgba(0,0,0,.6) 100%)}
#shake{position:absolute;inset:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 860px;will-change:transform}
.scene *{position:absolute}
#cap{position:absolute;left:90px;top:1338px;width:900px;height:240px}
.chunk{position:absolute;left:0;top:0;width:900px;text-align:center;font:900 80px/1.06 Mont;text-transform:uppercase;letter-spacing:-1px;display:none;transform-origin:50% 40%}
.chunk span{display:inline-block;margin:0 11px;color:#fff;-webkit-text-stroke:18px #040705;paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.55)}
.chunk span.on{color:var(--mus)}
/* shared */
.cam{left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.nb-panel.y{border-left-color:var(--amb);border-color:rgba(255,184,77,.35);background:linear-gradient(180deg,rgba(60,24,40,.95),rgba(30,12,22,.95))}
.nb-chip.y{border-color:rgba(255,184,77,.6);background:rgba(30,12,22,.92)}
.nb-chip.r{border-color:rgba(255,59,92,.65);background:rgba(40,8,14,.92)}
.nb-chip.c{border-color:rgba(95,224,255,.6);background:rgba(20,12,30,.92)}
.chipL{height:96px;padding:0 44px;font:700 46px/90px JB;letter-spacing:4px;color:var(--amb);text-align:center;white-space:nowrap}
.chipL.r{color:#ff6b80}.chipL.c{color:var(--cy)}.chipL.g{color:var(--acc)}
.panT{padding:18px 40px 20px 46px;font:800 42px/1.24 Mont;color:var(--paper);white-space:nowrap}
.panT b{position:static;color:var(--amb);font-weight:900}
.big{font:900 150px/1 Unb;color:#fff;-webkit-text-stroke:16px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.big i,.lbl i{position:static;font-style:normal;color:var(--mus)}
.lbl{font:900 80px/1 Unb;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.shd{border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));transform-origin:center}
.m{width:360px;height:360px}
.stt{border-radius:30px;text-align:center;background:rgba(20,6,14,.92);white-space:nowrap}
.conf{width:18px;height:28px;border-radius:4px}
.spark{width:36px;height:36px;background:#ffe14d;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.qm{font:900 120px/1 Unb;color:var(--amb);-webkit-text-stroke:12px var(--ink);paint-order:stroke fill}
.glow{border-radius:50%;background:radial-gradient(closest-side,rgba(255,211,77,.55),rgba(255,211,77,0))}
/* A — hook */
.a-t{left:0;top:190px;width:1080px}
.a-t2{left:0;top:380px;width:1080px}
.a-ph{left:90px;top:520px;width:360px;height:687px}
.a-key{left:390px;top:560px;width:260px;height:485px}
.a-db{left:720px;top:520px;width:280px;height:317px}
.a-m{left:680px;top:880px;width:380px;height:380px}
.a-shd1{left:90px;top:1170px;width:400px;height:70px}.a-shd2{left:700px;top:1220px;width:340px;height:60px}
/* B — hidden in the app, a million downloads */
.b-n{left:0;top:215px;width:1080px;font-size:112px}
.b-u{left:0;top:390px;width:1080px}
.b-ph{left:390px;top:470px;width:300px;height:573px}
.b-key{left:440px;top:300px;width:200px;height:373px}
.b-cp{width:130px;height:248px}
.b-m{left:700px;top:940px;width:350px;height:350px}
.b-shd{left:720px;top:1250px;width:300px;height:50px}
/* C — a safe key in every burger box */
.c-chip{left:40px;top:200px}
.c-safe{left:640px;top:330px;width:380px;height:396px}
.c-m{left:30px;top:340px;width:360px;height:360px}
.c-belt{left:-40px;top:1150px;width:1160px;height:70px;border-radius:35px;background:repeating-linear-gradient(90deg,#3a3f4f 0 40px,#2a2e3a 40px 80px);border:9px solid var(--ink)}
.c-bx{width:270px;height:219px}
.c-k{width:80px;height:149px}
/* D — the safe opens: names, phones, birthdays */
.d-safe{left:120px;top:430px;width:560px;height:584px}
.d-key{left:340px;top:560px;width:120px;height:224px}
.d-c{width:270px;height:203px}
.d-m{left:690px;top:900px;width:370px;height:370px}
.d-shd1{left:140px;top:990px;width:520px;height:60px}.d-shd2{left:720px;top:1240px;width:310px;height:50px}
/* J — joke: the lock is on, the key hangs on the handle */
.j-door{left:110px;top:300px;width:440px;height:800px}
.j-lock{left:362px;top:600px;width:130px;height:163px}
.j-th{left:-420px;top:700px;width:360px;height:432px}
.j-thm{left:-354px;top:765px;width:230px;height:187px}
.j-m{left:610px;top:850px;width:390px;height:390px}
.j-shd1{left:120px;top:1080px;width:420px;height:60px}.j-shd2{left:660px;top:1220px;width:350px;height:60px}
/* Q — who found me? */
.q-spot{left:140px;top:150px;width:800px;height:1200px;background:radial-gradient(40% 50% at 50% 55%,rgba(255,230,160,.35),rgba(255,230,160,0) 100%)}
.q-key{left:410px;top:430px;width:260px;height:485px}
.q-mag{left:640px;top:330px;width:260px;height:260px}
.q-m{left:30px;top:900px;width:340px;height:340px}
.q-shd{left:420px;top:900px;width:240px;height:50px}
/* R — a researcher with an AI */
.r-code{left:230px;top:200px;width:620px;height:460px}
.r-mag{left:250px;top:300px;width:200px;height:200px}
.r-key{left:400px;top:360px;width:110px;height:205px}
.r-p{left:10px;top:700px;width:330px;height:396px}
.r-lap{left:290px;top:860px;width:400px;height:277px}
.r-bot{left:700px;top:620px;width:320px;height:352px}
.r-m{left:760px;top:990px;width:290px;height:290px}
.r-chip{left:250px;top:640px}
.r-shd1{left:20px;top:1070px;width:320px;height:50px}.r-shd2{left:300px;top:1110px;width:390px;height:50px}.r-shd3{left:720px;top:950px;width:280px;height:40px}
/* S — not to thieves, to journalists */
.s-key{left:400px;top:330px;width:260px;height:485px}
.s-th{left:10px;top:600px;width:340px;height:408px}
.s-thm{left:72px;top:661px;width:216px;height:176px}
.s-x{left:240px;top:560px;width:140px;height:140px}
.s-news{left:720px;top:560px;width:310px;height:372px}
.s-src{left:40px;top:200px}
.s-m{left:360px;top:930px;width:360px;height:360px}
.s-shd1{left:20px;top:990px;width:320px;height:50px}.s-shd2{left:730px;top:920px;width:300px;height:50px}.s-shd3{left:380px;top:1250px;width:320px;height:50px}
/* H — the hole is patched, НЕ БАЙТ, takeaway, subscribe, loop */
.h-st{left:240px;top:250px;width:600px;height:180px;border:18px solid var(--acc);color:var(--acc);font:900 104px/144px Unb}
.h-ph{left:110px;top:520px;width:330px;height:630px}
.h-hole{left:185px;top:700px;width:180px;height:180px}
.h-patch{left:115px;top:720px;width:320px;height:124px}
.h-ok{left:360px;top:900px;width:120px;height:120px}
.h-key{left:430px;top:600px;width:170px;height:317px}
.h-board{left:110px;top:520px;width:330px;height:630px}
.h-c{width:220px;height:165px}
.h-chip{left:110px;top:1180px}
.h-m{left:640px;top:850px;width:390px;height:390px}
.h-sub{left:220px;top:1150px;width:660px;height:150px;border-radius:80px;background:linear-gradient(180deg,#ff4f6b,#e3243f);border:10px solid var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.5);font:900 54px/130px Unb;color:#fff;text-align:left;padding-left:160px}
.h-bell{left:40px;top:12px;width:110px;height:110px}
.h-shd1{left:120px;top:1120px;width:320px;height:60px}.h-shd2{left:660px;top:1210px;width:350px;height:60px}
.h-fx{left:0;top:0}
</style></head>
<body>
<div id="stage">
  <div id="bg"><div id="sky"></div><div id="diner"></div><div id="walk"></div><div id="street"></div><div class="blob" id="blob1"></div><div class="blob" id="blob2"></div></div>
  <div id="shake">
<div id="A" class="scene"><div class="cam"><div class="shd a-shd1"></div><div class="shd a-shd2"></div><div class="a-db"></div><div class="a-ph"></div><div class="a-key"></div><div class="m a-m"></div><div class="a-t big">ПАРОЛЬ</div><div class="a-t2 lbl">В <i>ПРИЛОЖЕНИИ</i></div></div></div>
<div id="B" class="scene"><div class="cam"><div class="b-grid"></div><div class="b-ph"></div><div class="b-key"></div><div class="shd b-shd"></div><div class="m b-m"></div><div class="b-n big"><i class="bnum">0</i></div><div class="b-u lbl">СКАЧИВАНИЙ</div></div></div>
<div id="C" class="scene"><div class="cam"><div class="c-safe"></div><div class="m c-m"></div><div class="c-belt"></div><div class="c-row"></div><div class="c-chip nb-chip y chipL">СЕТЬ РЕСТОРАНОВ</div></div></div>
<div id="D" class="scene"><div class="cam"><div class="shd d-shd1"></div><div class="shd d-shd2"></div><div class="d-safe"></div><div class="d-key"></div><div class="d-c d-c1"></div><div class="d-c d-c2"></div><div class="d-c d-c3"></div><div class="m d-m"></div></div></div>
<div id="J" class="scene"><div class="cam"><div class="shd j-shd1"></div><div class="shd j-shd2"></div><div class="j-door"></div><div class="j-lock"></div><div class="j-th"></div><div class="j-thm"></div><div class="m j-m"></div></div></div>
<div id="Q" class="scene"><div class="cam"><div class="q-spot"></div><div class="shd q-shd"></div><div class="q-key"></div><div class="q-mag"></div><div class="m q-m"></div></div></div>
<div id="R" class="scene"><div class="cam"><div class="r-code"></div><div class="r-key"></div><div class="r-mag"></div><div class="shd r-shd1"></div><div class="shd r-shd2"></div><div class="shd r-shd3"></div><div class="r-p"></div><div class="r-lap"></div><div class="r-bot"></div><div class="m r-m"></div><div class="r-chip nb-chip c chipL c">ИИ ИЩЕТ ПО КОДУ</div></div></div>
<div id="S" class="scene"><div class="cam"><div class="shd s-shd1"></div><div class="shd s-shd2"></div><div class="shd s-shd3"></div><div class="s-th"></div><div class="s-thm"></div><div class="s-x"></div><div class="s-news"></div><div class="s-key"></div><div class="m s-m"></div><div class="s-src nb-panel y panT"><b>TechCrunch</b> · 30.10.2026</div></div></div>
<div id="H" class="scene"><div class="cam"><div class="shd h-shd1"></div><div class="shd h-shd2"></div><div class="h-board"></div><div class="h-ph"></div><div class="h-hole"></div><div class="h-patch"></div><div class="h-ok"></div><div class="h-key"></div><div class="h-cards"></div><div class="m h-m"></div><div class="h-chip nb-chip r chipL r">НЕ ДАВАЙ ЛИШНЕГО</div>
  <div class="h-st stt">НЕ БАЙТ</div><div class="h-sub">ПОДПИШИСЬ<div class="h-bell"></div></div><div class="h-fx"></div></div></div>
<div id="A2" class="scene"></div>
  </div>
  <div id="vig"></div>
  <div id="cap"></div>
</div>
<script src="timing.js"></script>
<script src="env.js"></script>
<script src="engine.js"></script>

</body></html>
