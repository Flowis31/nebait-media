<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>short</title>
<style>
@font-face{font-family:Unb;src:url(fonts/Unb.ttf);font-weight:200 900}
@font-face{font-family:PF;src:url(fonts/PF.ttf);font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(fonts/PFi.ttf);font-weight:400 900;font-style:italic}
@font-face{font-family:JB;src:url(fonts/JB.ttf);font-weight:100 800}
@font-face{font-family:Mont;src:url(fonts/Mont.ttf);font-weight:100 900}
:root{--ink:#0a130d;--bg:#0c1f33;--acc:#ffb020;--accd:#e07a10;--paper:#f4ecd9;--red:#ff3b5c;--dim:#8fa698;--line:#24382c;--or:#ff9f2e;--cy:#5fe0ff;--yl:#ffd34d;--gr:#7dff8a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Mont;color:var(--paper)}
/* world: a city street on Halloween night — stars and moon (far), skyline (far), shop fronts (mid), lamps (near), road */
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#081428 0%,#12304e 40%,#2a3b66 62%,#3b2f55 100%)}
#stars{position:absolute;left:0;top:0;width:4800px;height:700px;will-change:transform}
#moon{position:absolute;left:700px;top:150px;width:300px;height:300px;will-change:transform}
#sky2{position:absolute;left:-700px;top:330px;width:3400px;height:900px;will-change:transform}
#shops{position:absolute;left:-700px;top:200px;width:3400px;height:1100px;will-change:transform}
#road{position:absolute;left:-200px;top:1260px;width:1500px;height:700px;background:linear-gradient(180deg,#2a2c38,#15161e)}
#dash{position:absolute;left:-700px;top:1330px;width:3400px;height:24px;will-change:transform;background:repeating-linear-gradient(90deg,#ffd34d 0 120px,transparent 120px 260px);opacity:.7}
#curb{position:absolute;left:-200px;top:1240px;width:1500px;height:30px;background:#5b5f70;border-top:6px solid #0a130d}
#near{position:absolute;left:-700px;top:40px;width:3400px;height:1300px;will-change:transform}
.blob{position:absolute;width:1240px;height:1240px;border-radius:50%;will-change:transform}
#blob1{left:-500px;top:-120px;background:radial-gradient(closest-side,rgba(255,176,32,.16) 0%,rgba(255,176,32,.05) 45%,rgba(255,176,32,0) 100%)}
#blob2{left:320px;top:860px;background:radial-gradient(closest-side,rgba(95,224,255,.12) 0%,rgba(95,224,255,.04) 45%,rgba(95,224,255,0) 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(90% 62% at 50% 46%,transparent 55%,rgba(0,0,10,.55) 100%)}
#shake{position:absolute;inset:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 860px;will-change:transform}
.scene *{position:absolute}
#cap{position:absolute;left:90px;top:1338px;width:900px;height:240px}
.chunk{position:absolute;left:0;top:0;width:900px;text-align:center;font:900 80px/1.06 Mont;text-transform:uppercase;letter-spacing:-1px;display:none;transform-origin:50% 40%}
.chunk span{display:inline-block;margin:0 11px;color:#fff;-webkit-text-stroke:18px #040705;paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.55)}
.chunk span.on{color:var(--yl)}
/* shared */
.cam{left:0;top:70px;width:1080px;height:1920px;transform-origin:540px 900px}
.nb-panel.o{border-left-color:var(--or);border-color:rgba(255,159,46,.4);background:linear-gradient(180deg,rgba(40,24,40,.94),rgba(20,12,24,.94))}
.nb-chip.o{border-color:rgba(255,159,46,.7);background:rgba(24,14,24,.92)}
.nb-chip.c{border-color:rgba(95,224,255,.7);background:rgba(10,20,34,.92)}
.nb-chip.g{border-color:rgba(125,255,138,.7);background:rgba(10,26,16,.92)}
.chipL{height:96px;padding:0 44px;font:700 46px/90px JB;letter-spacing:4px;color:var(--or);text-align:center;white-space:nowrap}
.chipL.c{color:var(--cy)}.chipL.g{color:var(--gr)}
.panT{padding:18px 40px 20px 46px;font:800 42px/1.24 Mont;color:var(--paper);white-space:nowrap}
.panT b{position:static;color:var(--or);font-weight:900}
.big{font:900 150px/1 Unb;color:#fff;-webkit-text-stroke:16px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.big i,.lbl i{position:static;font-style:normal;color:var(--yl)}
.lbl{font:900 80px/1 Unb;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.shd{border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,10,.6),rgba(0,0,10,0));transform-origin:center}
.stt{border-radius:30px;text-align:center;background:rgba(14,8,20,.92);white-space:nowrap}
.conf{width:18px;height:28px;border-radius:4px}
.spark{width:36px;height:36px;background:#ffe14d;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.sweat{width:26px;height:36px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#8fe0ff;border:5px solid var(--ink)}
.qm{font:900 120px/1 Unb;color:var(--or);-webkit-text-stroke:12px var(--ink);paint-order:stroke fill}
.note{font:900 80px/1 Unb;color:var(--yl);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill}
.mini{width:120px;height:104px}
.bat{width:80px;height:40px}
.sayb{border-radius:44px;background:#fff;border:10px solid var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.35);font:900 54px/1.08 Unb;color:var(--ink);text-align:center;padding:34px 26px}
.sayb:after{content:'';position:absolute;left:90px;bottom:-46px;width:60px;height:60px;background:#fff;border-right:10px solid var(--ink);border-bottom:10px solid var(--ink);transform:rotate(45deg) skew(12deg,12deg)}
.rays{border-radius:50%;background:repeating-conic-gradient(rgba(255,210,120,.32) 0 10deg,rgba(255,210,120,0) 10deg 24deg)}
.btn{width:250px;height:96px;border-radius:26px;border:8px solid var(--ink);background:#e9f2ff;font:900 52px/80px Unb;color:var(--ink);text-align:center}
.btn.go{background:#3ad15a;color:#fff;-webkit-text-stroke:0}
.ring{border:10px solid #fff;border-radius:50%}
/* A — hook */
.a-n{left:0;top:110px;width:1080px;font-size:270px}
.a-t2{left:0;top:390px;width:1080px;font-size:96px}
.a-t3{left:0;top:500px;width:1080px;font-size:60px;-webkit-text-stroke:10px var(--ink)}
.a-taxi{left:380px;top:640px;width:620px;height:537px}
.a-m{left:14px;top:820px;width:380px;height:380px}
.a-shd1{left:400px;top:1130px;width:580px;height:90px}.a-shd2{left:40px;top:1160px;width:300px;height:60px}
/* B — «Это я, такси, и доставка еды в Хэллоуин» */
.b-taxi{left:30px;top:540px;width:660px;height:572px}
.b-box{left:700px;top:560px;width:260px;height:211px}
.b-m{left:680px;top:820px;width:390px;height:390px}
.b-chip{left:40px;top:190px}
.b-pk1{left:-10px;top:1000px;width:190px;height:174px}.b-pk2{left:520px;top:1010px;width:170px;height:156px}
.b-shd1{left:60px;top:1070px;width:600px;height:90px}.b-shd2{left:720px;top:1170px;width:320px;height:60px}
/* Q — «А сколько раз меня заказали нейронки?» */
.q-bot{left:40px;top:470px;width:440px;height:484px}
.q-taxi{left:500px;top:560px;width:540px;height:468px}
.q-m{left:330px;top:900px;width:300px;height:300px}
.q-shd1{left:70px;top:920px;width:380px;height:70px}.q-shd2{left:520px;top:990px;width:500px;height:80px}.q-shd3{left:350px;top:1170px;width:260px;height:50px}
/* C — the agent: a chatbot that presses the buttons itself */
.c-chip{left:40px;top:180px}
.c-bot{left:250px;top:620px;width:330px;height:363px}
.c-ph{left:590px;top:320px;width:380px;height:725px}
.c-say{left:30px;top:330px;width:440px}
.c-m{left:0px;top:860px;width:350px;height:350px}
.c-shd1{left:270px;top:950px;width:290px;height:60px}.c-shd2{left:600px;top:1020px;width:360px;height:70px}.c-shd3{left:0;top:1170px;width:290px;height:50px}
/* P — bots promise to order for you */
.p-bot1{left:20px;top:380px;width:300px;height:330px}.p-bot2{left:760px;top:380px;width:300px;height:330px}
.p-tr1{left:230px;top:440px;width:300px;height:130px}.p-tr2{left:550px;top:440px;width:300px;height:130px}
.p-m{left:330px;top:760px;width:420px;height:420px}
.p-pk{left:390px;top:1030px;width:300px;height:275px}
.p-taxi{left:430px;top:580px;width:220px;height:191px}
.p-shd1{left:40px;top:700px;width:260px;height:50px}.p-shd2{left:780px;top:700px;width:260px;height:50px}.p-shd3{left:370px;top:1250px;width:340px;height:60px}
/* R — Uber's report: four rides */
.r-src{left:40px;top:180px}
.r-tal{left:290px;top:360px;width:500px;height:577px}
.r-n{left:0;top:330px;width:1080px;font-size:420px;color:var(--yl)}
.r-taxi{left:20px;top:850px;width:380px;height:329px}
.r-m{left:690px;top:830px;width:380px;height:380px}
.r-shd1{left:330px;top:900px;width:420px;height:70px}.r-shd2{left:40px;top:1140px;width:340px;height:60px}.r-shd3{left:730px;top:1170px;width:300px;height:60px}
/* J — joke: four riders, one taxi */
.j-taxi{left:140px;top:400px;width:800px;height:693px}
.j-m{left:10px;top:880px;width:330px;height:330px}
.j-shd1{left:170px;top:1060px;width:740px;height:100px}.j-shd2{left:0;top:1170px;width:260px;height:50px}
.j-cnt{font:900 110px/1 Unb;color:var(--yl);-webkit-text-stroke:12px var(--ink);paint-order:stroke fill}
/* H — БАЙТ, takeaway, loop */
.h-st{left:240px;top:200px;width:600px;height:180px;border:18px solid var(--red);color:var(--red);font:900 120px/144px Unb}
.h-m{left:60px;top:780px;width:400px;height:400px}
.h-ph{left:380px;top:820px;width:150px;height:286px}
.h-sw{left:60px;top:440px;width:280px;height:336px}
.h-taxi{left:470px;top:580px;width:520px;height:451px}
.h-bot{left:800px;top:920px;width:240px;height:264px}
.h-chip{left:30px;top:1110px}
.h-shd1{left:100px;top:1150px;width:320px;height:60px}.h-shd2{left:490px;top:990px;width:480px;height:80px}.h-shd3{left:810px;top:1160px;width:220px;height:40px}
.h-fx{left:0;top:0}
</style></head>
<body>
<div id="stage">
  <div id="bg"><div id="stars"></div><div id="moon"></div><div id="sky2"></div><div id="shops"></div><div id="curb"></div><div id="road"></div><div id="dash"></div><div id="near"></div><div class="blob" id="blob1"></div><div class="blob" id="blob2"></div></div>
  <div id="shake">
<div id="A" class="scene"><div class="cam"><div class="a-fx"></div><div class="shd a-shd1"></div><div class="shd a-shd2"></div><div class="a-taxi"></div><div class="a-m mm"></div><div class="a-n big"><i>320</i></div><div class="a-t2 lbl">МИЛЛИОНОВ</div><div class="a-t3 lbl">ЗАКАЗОВ ЗА НЕДЕЛЮ</div></div></div>
<div id="B" class="scene"><div class="cam"><div class="shd b-shd1"></div><div class="shd b-shd2"></div><div class="b-pk1"></div><div class="b-taxi"></div><div class="b-pk2"></div><div class="b-box"></div><div class="b-m mm"></div><div class="b-chip nb-chip o chipL">НЕДЕЛЯ ХЭЛЛОУИНА</div></div></div>
<div id="Q" class="scene"><div class="cam"><div class="shd q-shd1"></div><div class="shd q-shd2"></div><div class="shd q-shd3"></div><div class="q-taxi"></div><div class="q-bot"></div><div class="q-m mm"></div></div></div>
<div id="C" class="scene"><div class="cam"><div class="shd c-shd1"></div><div class="shd c-shd2"></div><div class="shd c-shd3"></div><div class="c-ph"></div><div class="c-bot"></div><div class="c-m mm"></div><div class="c-say sayb">«ВЫЗОВИ ТАКСИ»</div><div class="c-chip nb-chip c chipL c">НЕЙРОНКА-АГЕНТ = ЧАТ-БОТ</div></div></div>
<div id="P" class="scene"><div class="cam"><div class="shd p-shd1"></div><div class="shd p-shd2"></div><div class="shd p-shd3"></div><div class="p-pk"></div><div class="p-m mm"></div><div class="p-bot1"></div><div class="p-bot2"></div><div class="p-tr1"></div><div class="p-tr2"></div><div class="p-taxi"></div></div></div>
<div id="R" class="scene"><div class="cam"><div class="shd r-shd1"></div><div class="shd r-shd2"></div><div class="shd r-shd3"></div><div class="r-tal"></div><div class="r-taxi"></div><div class="r-m mm"></div><div class="r-src nb-panel o panT"><b>Uber</b>, отчёт 04.11.2026 · TechCrunch</div></div></div>
<div id="J" class="scene"><div class="cam"><div class="shd j-shd1"></div><div class="shd j-shd2"></div><div class="j-taxi"></div><div class="j-m mm"></div></div></div>
<div id="H" class="scene"><div class="cam"><div class="shd h-shd1"></div><div class="shd h-shd2"></div><div class="shd h-shd3"></div><div class="h-taxi"></div><div class="h-bot"></div><div class="h-sw"></div><div class="h-m mm"></div><div class="h-ph"></div>
  <div class="h-chip nb-chip g chipL g">САМ: ~50 СЕКУНД</div><div class="h-st stt">БАЙТ</div><div class="h-fx"></div></div></div>
<div id="A2" class="scene"></div>
  </div>
  <div id="vig"></div>
  <div id="cap"></div>
</div>
<script src="timing.js"></script>
<script src="env.js"></script>
<script src="engine.js"></script>
<script src="mascot.js"></script>
<script src="props.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
</body></html>
