<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>short</title>
<style>
@font-face{font-family:Unb;src:url(fonts/Unb.ttf);font-weight:200 900}
@font-face{font-family:PF;src:url(fonts/PF.ttf);font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(fonts/PFi.ttf);font-weight:400 900;font-style:italic}
@font-face{font-family:JB;src:url(fonts/JB.ttf);font-weight:100 800}
@font-face{font-family:Mont;src:url(fonts/Mont.ttf);font-weight:100 900}
:root{--ink:#0a130d;--bg:#2a1546;--acc:#43f0ff;--accd:#1aa8c8;--paper:#f4ecd9;--red:#ff3b5c;--dim:#8fa698;--line:#24382c;--or:#ff9f2e;--yl:#ffd34d;--pk:#ff5fa2;--gr:#7dff8a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Mont;color:var(--paper)}
/* world: a running stadium at sunset */
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#2a1546 0%,#6a2a6a 30%,#d8566a 52%,#ff9a6a 64%,#3a2350 64.5%)}
#sun{position:absolute;left:560px;top:520px;width:420px;height:420px;will-change:transform}
#clouds{position:absolute;left:-700px;top:120px;width:3400px;height:500px;will-change:transform}
#stands{position:absolute;left:-700px;top:520px;width:3400px;height:900px;will-change:transform}
#lights{position:absolute;left:-700px;top:120px;width:3400px;height:1100px;will-change:transform}
#track{position:absolute;left:0;top:1150px;width:1080px;height:770px}
#lanes{position:absolute;left:-700px;top:1150px;width:3400px;height:770px;will-change:transform}
#near{position:absolute;left:-700px;top:30px;width:3400px;height:1150px;will-change:transform}
.blob{position:absolute;width:1240px;height:1240px;border-radius:50%;will-change:transform}
#blob1{left:-500px;top:-120px;background:radial-gradient(closest-side,rgba(67,240,255,.12) 0%,rgba(67,240,255,.04) 45%,rgba(67,240,255,0) 100%)}
#blob2{left:320px;top:860px;background:radial-gradient(closest-side,rgba(255,95,162,.12) 0%,rgba(255,95,162,.04) 45%,rgba(255,95,162,0) 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(90% 62% at 50% 46%,transparent 55%,rgba(10,0,20,.55) 100%)}
#shake{position:absolute;inset:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 860px;will-change:transform}
.scene *{position:absolute}
#cap{position:absolute;left:90px;top:1338px;width:900px;height:240px}
.chunk{position:absolute;left:0;top:0;width:900px;text-align:center;font:900 80px/1.06 Mont;text-transform:uppercase;letter-spacing:-1px;display:none;transform-origin:50% 40%}
.chunk span{display:inline-block;margin:0 11px;color:#fff;-webkit-text-stroke:18px #040705;paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.55)}
.chunk span.on{color:var(--acc)}
/* shared */
.cam{left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.nb-panel{border-left-color:var(--acc);border-color:rgba(67,240,255,.35);background:linear-gradient(180deg,rgba(30,18,52,.94),rgba(16,10,30,.94))}
.nb-chip{border-color:rgba(67,240,255,.7);background:rgba(20,12,36,.92)}
.nb-chip.p{border-color:rgba(255,95,162,.8)}
.chipL{height:96px;padding:0 44px;font:700 46px/90px JB;letter-spacing:4px;color:var(--acc);text-align:center;white-space:nowrap}
.chipL.p{color:var(--pk)}
.panT{padding:18px 40px 20px 46px;font:800 38px/1.3 Mont;color:var(--paper);white-space:nowrap}
.panT b{position:static;color:var(--acc);font-weight:900}
.big{font:900 150px/1 Unb;color:#fff;-webkit-text-stroke:16px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.big i{position:static;font-style:normal;color:var(--yl)}
.lbl{font:900 80px/1 Unb;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.lbl i{position:static;font-style:normal;color:var(--acc)}
.shd{border-radius:50%;background:radial-gradient(closest-side,rgba(20,0,20,.6),rgba(20,0,20,0));transform-origin:center}
.stt{border-radius:30px;text-align:center;background:rgba(20,8,24,.92);white-space:nowrap}
.conf{width:18px;height:28px;border-radius:4px}
.spark{width:36px;height:36px;background:#ffe14d;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.drop{width:24px;height:32px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#9ff6ff;border:5px solid var(--ink)}
.qm{font:900 120px/1 Unb;color:var(--yl);-webkit-text-stroke:12px var(--ink);paint-order:stroke fill}
.ring{border:10px solid #fff;border-radius:50%}
.flash{left:0;top:0;width:1080px;height:1920px;background:#fff}
/* A — hook: two phones on the start line */
.a-n1{left:10px;top:190px;width:640px;font-size:128px}
.a-n2{left:520px;top:420px;width:470px;font-size:94px}
.a-vs{left:690px;top:210px;width:150px;height:110px;border-radius:30px;background:var(--red);border:10px solid var(--ink);font:900 64px/90px Unb;color:#fff;text-align:center}
.a-big{left:40px;top:440px;width:380px;height:709px}
.a-sm{left:650px;top:640px;width:270px;height:504px}
.a-m{left:360px;top:860px;width:340px;height:340px}
.a-shd1{left:40px;top:1110px;width:380px;height:80px}.a-shd2{left:640px;top:1110px;width:290px;height:70px}.a-shd3{left:380px;top:1160px;width:300px;height:56px}
/* B — cutaway: batteries inside */
.b-big{left:60px;top:300px;width:400px;height:747px}
.b-sm{left:520px;top:530px;width:276px;height:515px}
.b-x2{left:0;top:170px;width:1080px;font-size:96px}
.b-m{left:760px;top:800px;width:310px;height:310px}
.b-ruler{left:470px;top:300px;width:40px;height:747px}
/* Q — who lasts longer */
.q-big{left:30px;top:470px;width:360px;height:672px}
.q-sm{left:690px;top:630px;width:270px;height:504px}
.q-sw{left:395px;top:420px;width:290px;height:348px}
.q-m{left:360px;top:850px;width:350px;height:350px}
.q-shd1{left:40px;top:1110px;width:360px;height:70px}.q-shd2{left:690px;top:1110px;width:280px;height:60px}.q-shd3{left:390px;top:1160px;width:300px;height:56px}
/* C — top view: the race */
.c-top{left:0;top:180px;width:1080px;height:1100px}
.c-run{width:120px;height:224px}
.c-sg{width:150px;height:150px}
.c-chip{left:40px;top:150px}
.c-m{left:400px;top:600px;width:280px;height:280px}
/* T — capacity = tank */
.t-tank{left:250px;top:330px;width:580px;height:741px}
.t-chip{left:40px;top:170px}
.t-m{left:20px;top:870px;width:330px;height:330px}
.t-shd{left:260px;top:1030px;width:560px;height:90px}
/* M — the motor */
.m-tank{left:30px;top:520px;width:330px;height:422px}
.m-ph{left:420px;top:450px;width:300px;height:560px}
.m-ic{width:200px;height:200px}
.m-pipe{left:0;top:0;width:1080px;height:1400px}
.m-m{left:20px;top:900px;width:330px;height:330px}
.m-shd1{left:40px;top:910px;width:310px;height:60px}.m-shd2{left:420px;top:980px;width:300px;height:60px}
/* J — joke: gulps vs sips */
.j-big{left:10px;top:400px;width:400px;height:747px}
.j-jug{left:400px;top:720px;width:300px;height:420px}
.j-sm{left:820px;top:800px;width:180px;height:336px}
.j-cup{left:730px;top:1060px;width:150px;height:109px}
.j-m{left:-30px;top:950px;width:270px;height:270px}
.j-shd1{left:20px;top:1110px;width:390px;height:80px}.j-shd2{left:400px;top:1110px;width:300px;height:70px}.j-shd3{left:780px;top:1120px;width:260px;height:50px}
/* R — finish: a draw */
.r-fin{left:40px;top:400px;width:1000px;height:700px}
.r-pod{left:190px;top:1000px;width:700px;height:260px}
.r-big{left:250px;top:497px;width:280px;height:523px}
.r-sm{left:600px;top:628px;width:210px;height:392px}
.r-src{left:40px;top:150px}
.r-m{left:10px;top:880px;width:280px;height:280px}
.r-tie{left:0;top:300px;width:1080px;font-size:120px}
/* V — БАЙТ + appetite */
.v-st{left:240px;top:250px;width:600px;height:180px;border:18px solid var(--red);color:var(--red);font:900 120px/144px Unb}
.v-m{left:330px;top:760px;width:420px;height:420px}
.v-big{left:20px;top:650px;width:260px;height:485px}
.v-sm{left:800px;top:760px;width:200px;height:373px}
.v-g{left:290px;top:430px;width:500px;height:336px}
.v-chip{left:190px;top:1190px}
.v-shd1{left:30px;top:1100px;width:260px;height:60px}.v-shd2{left:800px;top:1110px;width:210px;height:50px}.v-shd3{left:380px;top:1150px;width:320px;height:60px}
.v-fx{left:0;top:0}
</style></head>
<body>
<div id="stage">
  <div id="bg"><div id="sun"></div><div id="clouds"></div><div id="stands"></div><div id="lights"></div><div id="track"></div><div id="lanes"></div><div id="near"></div><div class="blob" id="blob1"></div><div class="blob" id="blob2"></div></div>
  <div id="shake">
<div id="A" class="scene"><div class="cam"><div class="shd a-shd1"></div><div class="shd a-shd2"></div><div class="shd a-shd3"></div><div class="a-big ph"></div><div class="a-sm ph"></div><div class="a-m mm"></div>
  <div class="a-n1 big"><i>7 300</i></div><div class="a-n2 big">≈3 700</div><div class="a-vs">VS</div></div></div>
<div id="B" class="scene"><div class="cam"><div class="b-big"></div><div class="b-sm"></div><div class="b-m mm"></div><div class="b-x2 lbl">ПОЧТИ <i>×2</i></div></div></div>
<div id="Q" class="scene"><div class="cam"><div class="shd q-shd1"></div><div class="shd q-shd2"></div><div class="shd q-shd3"></div><div class="q-big ph"></div><div class="q-sm ph"></div><div class="q-sw"></div><div class="q-m mm"></div></div></div>
<div id="C" class="scene"><div class="cam"><div class="c-top"></div><div class="c-m mm"></div><div class="c-chip nb-chip chipL">ТЕХНОСАЙТ CNET</div></div></div>
<div id="T" class="scene"><div class="cam"><div class="shd t-shd"></div><div class="t-tank"></div><div class="t-m mm"></div><div class="t-chip nb-chip chipL">ЁМКОСТЬ = БАК</div></div></div>
<div id="M" class="scene"><div class="cam"><div class="shd m-shd1"></div><div class="shd m-shd2"></div><div class="m-pipe"></div><div class="m-tank"></div><div class="m-ph ph"></div><div class="m-m mm"></div><div class="m-chip nb-chip p chipL p" style="left:560px;top:170px">МОТОР</div></div></div>
<div id="J" class="scene"><div class="cam"><div class="shd j-shd1"></div><div class="shd j-shd2"></div><div class="shd j-shd3"></div><div class="j-big ph"></div><div class="j-jug"></div><div class="j-sm ph"></div><div class="j-cup"></div><div class="j-m mm"></div></div></div>
<div id="R" class="scene"><div class="cam"><div class="r-fin"></div><div class="r-pod"></div><div class="r-big ph"></div><div class="r-sm ph"></div><div class="r-m mm"></div><div class="r-tie lbl">НИЧЬЯ</div>
  <div class="r-src nb-panel panT"><b>Тест CNET</b>: iPhone 17 и OnePlus 15<br>9to5Mac, 11.11.2026</div></div></div>
<div id="V" class="scene"><div class="cam"><div class="shd v-shd1"></div><div class="shd v-shd2"></div><div class="shd v-shd3"></div><div class="v-g"></div><div class="v-big ph"></div><div class="v-sm ph"></div><div class="v-m mm"></div>
  <div class="v-chip nb-chip chipL">СМОТРИ НА АППЕТИТ</div><div class="v-st stt">БАЙТ</div><div class="v-fx"></div></div></div>
<div id="A2" class="scene"></div>
  </div>
  <div id="vig"></div>
  <div id="cap"></div>
</div>
<script src="timing.js"></script>
<script src="env.js"></script>
<script src="engine.js"></script>
<script src="mascot.js"></script>
<script src="props.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
</body></html>
