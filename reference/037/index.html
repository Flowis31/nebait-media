<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>short</title>
<style>
@font-face{font-family:Unb;src:url(fonts/Unb.ttf);font-weight:200 900}
@font-face{font-family:PF;src:url(fonts/PF.ttf);font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(fonts/PFi.ttf);font-weight:400 900;font-style:italic}
@font-face{font-family:JB;src:url(fonts/JB.ttf);font-weight:100 800}
@font-face{font-family:Mont;src:url(fonts/Mont.ttf);font-weight:100 900}
:root{--ink:#0a130d;--bg:#2b1450;--acc:#ff5fb0;--accd:#d83a8a;--paper:#f4ecd9;--red:#ff3b5c;--cy:#5fe0ff;--yl:#ffe14d;--pk:#ff5fd2;--gr:#7dff8a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Mont;color:var(--paper)}

/* world: sunset coast city (own art) — sky, far skyline, palms layer, road */
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#0d0730 0%,#2b0f5c 30%,#7a1f7a 46%,#ff4f8a 56%,#ff9a5c 62%,#ffd07a 66%,#2b1450 66.4%,#1c0d3a 100%)}
#sun{position:absolute;left:290px;top:820px;width:500px;height:500px;border-radius:50%;background:repeating-linear-gradient(180deg,#ffe07a 0 34px,#ff8a5c 34px 40px);clip-path:inset(0 0 52% 0);will-change:transform}
#sky2{position:absolute;left:-700px;top:520px;width:3400px;height:760px;will-change:transform}
#palms{position:absolute;left:-700px;top:560px;width:3400px;height:760px;will-change:transform}
#road{position:absolute;left:0;top:1275px;width:1080px;height:650px;background:linear-gradient(180deg,#2a2346 0%,#1a1530 100%)}
#lines{position:absolute;left:-700px;top:1290px;width:3400px;height:20px;will-change:transform;background:repeating-linear-gradient(90deg,#ffd34d 0 90px,transparent 90px 200px)}
.star{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff}
.blob{position:absolute;width:1240px;height:1240px;border-radius:50%;will-change:transform}
#blob1{left:-500px;top:-120px;background:radial-gradient(closest-side,rgba(255,95,176,.16) 0%,rgba(255,95,176,.05) 45%,rgba(255,95,176,0) 100%)}
#blob2{left:320px;top:860px;background:radial-gradient(closest-side,rgba(95,224,255,.10) 0%,rgba(95,224,255,.03) 45%,rgba(95,224,255,0) 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(90% 62% at 50% 46%,transparent 55%,rgba(8,0,20,.6) 100%)}
#shake{position:absolute;inset:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 860px;will-change:transform}
.scene *{position:absolute}
#cap{position:absolute;left:90px;top:1338px;width:900px;height:240px}
.chunk{position:absolute;left:0;top:0;width:900px;text-align:center;font:900 80px/1.06 Mont;text-transform:uppercase;letter-spacing:-1px;display:none;transform-origin:50% 40%}
.chunk span{display:inline-block;margin:0 11px;color:#fff;-webkit-text-stroke:18px #040705;paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.55)}
.chunk span.on{color:#ffd34d}
.cam{left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.scene .nb-panel{border-left-color:var(--acc);border-color:rgba(255,95,176,.4);background:linear-gradient(180deg,rgba(40,16,64,.95),rgba(24,8,40,.95))}
.scene .nb-chip{border-color:rgba(255,95,176,.8);background:rgba(30,10,50,.93)}
.chipL{height:96px;padding:0 44px;font:700 46px/90px JB;letter-spacing:4px;color:#ffd34d;text-align:center;white-space:nowrap}
.panT{padding:18px 40px 20px 46px;font:800 36px/1.24 Mont;color:var(--paper);white-space:nowrap}
.panT b{position:static;color:#ffd34d;font-weight:900}
.big{font:900 170px/1 Unb;color:#fff;-webkit-text-stroke:16px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.big i,.lbl i{position:static;font-style:normal;color:#ffd34d}
.lbl{font:900 92px/1 Unb;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.shd{border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0))}
.conf{width:18px;height:28px;border-radius:4px}
.spark{width:36px;height:36px;background:#ffe14d;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.stt{border-radius:30px;text-align:center;background:rgba(40,6,14,.92);white-space:nowrap;border:16px solid var(--red);color:var(--red);font:900 120px/170px Unb;padding:0 40px}
.stt.g{border-color:#7dff8a;color:#7dff8a;background:rgba(6,30,14,.92)}
.mm{width:380px;height:380px}

.rays{left:-460px;top:-500px;width:2000px;height:2000px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,220,140,.22) 0 6deg,rgba(255,220,140,0) 6deg 18deg);-webkit-mask-image:radial-gradient(closest-side,#000 20%,transparent 75%);mask-image:radial-gradient(closest-side,#000 20%,transparent 75%)}
.title{font:900 150px/1 Unb;color:#fff;-webkit-text-stroke:16px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap;text-shadow:0 0 40px rgba(255,95,176,.7)}
.title i{position:static;font-style:normal;color:#ffd34d}
.vhs{left:0;top:0;width:1080px;height:1920px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 3px,transparent 3px 7px);mix-blend-mode:overlay}
.rec{left:80px;top:180px;font:700 48px/1 JB;color:#fff;letter-spacing:4px}
.rec b{position:static;color:#ff3b5c}
.pol{width:330px;height:390px;background:#f4ecd9;border:8px solid var(--ink);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pol .ph{left:18px;top:18px;width:278px;height:250px;background:linear-gradient(180deg,#ffb36b,#ff5fb0 60%,#6a3cff);border:5px solid var(--ink)}
.pol .pt{left:0;top:290px;width:314px;text-align:center;font:900 34px/1.1 Unb;color:var(--ink)}
.bub{padding:14px 34px;border-radius:40px;border:7px solid var(--ink);background:#fff;font:900 46px/1 Unb;color:var(--ink);white-space:nowrap}
.bub.r{background:#ff5f6d;color:#fff}.bub.y{background:#ffd34d}.bub.c{background:#5fe0ff}
.dig{font:900 520px/1 Unb;color:#fff;-webkit-text-stroke:22px var(--ink);paint-order:stroke fill;text-align:center;width:1080px;left:0}
.dig.n{color:#ffd34d;text-shadow:0 0 60px rgba(255,211,77,.9)}
.piece{width:90px;height:90px;background:#fff;border:8px solid var(--ink)}
/* scene boxes */
.a-t{left:0;top:230px;width:1080px}.a-t2{left:0;top:400px;width:1080px}
.b-crt{left:190px;top:470px;width:700px;height:608px}.b-yr{left:0;top:230px;width:1080px;font-size:170px}.b-con{left:420px;top:1040px;width:260px;height:216px}
.c-k{width:300px;height:250px}.c-l{left:0;top:250px;width:1080px;font-size:96px}
.d-n{left:0;top:220px;width:1080px;font-size:100px}.d-l{left:0;top:360px;width:1080px;font-size:66px}.d-grid{left:0;top:0;width:1080px;height:1920px}.d-case{width:120px;height:156px}
.e-chip{left:60px;top:200px}
.f-tower{left:640px;top:180px;width:300px;height:1120px;background:linear-gradient(90deg,#3b2f6a,#2a2046);border:10px solid var(--ink);border-radius:14px}
.f-para{left:150px;top:200px;width:400px;height:420px}.f-hs{left:640px;top:940px;width:300px;height:260px}
.g-chip{left:60px;top:200px}
.h-m{left:330px;top:820px}.h-q{left:780px;top:560px;font:900 200px/1 Unb;color:#ffd34d;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill}
.i-m{left:380px;top:900px;width:330px;height:330px}
.j-t{left:0;top:300px;width:1080px;font-size:230px}.j-d{left:0;top:540px;width:1080px;font-size:56px}
.k-q{left:0;top:240px;width:1080px;font-size:66px;-webkit-text-stroke:11px var(--ink)}.k-st{left:150px;top:470px;width:780px}.k-m{left:350px;top:860px}
.l-5{top:330px}.l-6{top:330px}.l-cap{left:0;top:920px;width:1080px;font-size:70px}
.m-q{left:0;top:250px;width:1080px;font-size:84px;line-height:1.15}.m-m{left:90px;top:860px}.m-case{left:640px;top:820px;width:300px;height:390px}
</style></head>
<body>
<div id="stage">
  <div id="bg"><div id="sun"></div><div id="stars"></div><div id="sky2"></div><div id="palms"></div><div id="road"></div><div id="lines"></div><div class="blob" id="blob1"></div><div class="blob" id="blob2"></div></div>
  <div id="shake">
<div id="A" class="scene"><div class="cam a-cam"></div><div class="a-t title">КОНЕЦ</div><div class="a-t2 title"><i>ЭПОХИ</i></div></div>
<div id="B" class="scene"><div class="cam"><div class="b-yr big"><i class="yr">2026</i></div><div class="b-crt"></div><div class="b-con"></div><div class="rec">◀◀ <b>REW</b></div></div><div class="vhs"></div></div>
<div id="C" class="scene"><div class="cam"><div class="c-l lbl"><i>3</i> ПОКОЛЕНИЯ</div></div></div>
<div id="D" class="scene"><div class="cam"><div class="d-grid"></div><div class="d-n big"><span class="cnt" style="position:static">0</span></div><div class="d-l lbl">КОПИЙ <i>GTA 5</i></div></div></div>
<div id="E" class="scene"><div class="cam e-cam"></div><div class="e-chip nb-chip chipL">ЗАЕЗДЫ С ДРУЗЬЯМИ</div></div>
<div id="F" class="scene"><div class="cam"><div class="f-tower"></div><div class="f-para"></div><div class="f-m mm" style="left:240px;top:560px;width:220px;height:220px"></div><div class="shd" style="left:660px;top:1170px;width:280px;height:50px"></div><div class="f-hs"></div></div></div>
<div id="G" class="scene"><div class="cam g-cam"></div><div class="g-chip nb-chip chipL">RP-СЕРВЕРЫ</div></div>
<div id="H" class="scene"><div class="cam"><div class="shd" style="left:350px;top:1180px;width:340px;height:60px"></div><div class="h-m mm"></div><div class="h-q">?</div></div></div>
<div id="I" class="scene"><div class="cam"><div class="shd" style="left:390px;top:1210px;width:300px;height:50px"></div><div class="i-m mm"></div></div></div>
<div id="J" class="scene"><div class="cam j-cam"></div><div class="rays"></div><div class="j-t title">GTA <i>6</i></div><div class="j-d lbl">ВЫШЛА <i>СЕГОДНЯ</i></div></div>
<div id="K" class="scene"><div class="cam"><div class="k-q big">ГЛАВНОЕ СОБЫТИЕ<br><i>ДЕСЯТИЛЕТИЯ?</i></div><div class="shd" style="left:370px;top:1210px;width:340px;height:60px"></div><div class="k-m mm"></div><div class="k-st stt g">НЕ БАЙТ</div></div></div>
<div id="L" class="scene"><div class="cam"><div class="l-5 dig">5</div><div class="l-6 dig n">6</div><div class="l-cap lbl">НОВАЯ <i>ЭПОХА</i></div></div></div>
<div id="M" class="scene"><div class="cam"><div class="m-q big">А ЧТО ТЫ<br><i>ЗАПОМНИЛ?</i></div><div class="m-case"></div><div class="shd" style="left:110px;top:1210px;width:340px;height:60px"></div><div class="m-m mm"></div></div></div>
<div id="A2" class="scene"></div>
  </div>
  <div id="vig"></div>
  <div id="cap"></div>
</div>
<script src="timing.js"></script>
<script src="env.js"></script>
<script src="engine.js"></script>
<script src="mascot.js"></script>
<script src="props.js"></script>
<script src="world3d.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
</body></html>
