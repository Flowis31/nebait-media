<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>short</title>
<style>
@font-face{font-family:Unb;src:url(fonts/Unb.ttf);font-weight:200 900}
@font-face{font-family:PF;src:url(fonts/PF.ttf);font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(fonts/PFi.ttf);font-weight:400 900;font-style:italic}
@font-face{font-family:JB;src:url(fonts/JB.ttf);font-weight:100 800}
@font-face{font-family:Mont;src:url(fonts/Mont.ttf);font-weight:100 900}
:root{--ink:#0a130d;--bg:#2b1450;--acc:#ff5fb0;--accd:#d83a8a;--paper:#f4ecd9;--red:#ff3b5c;--cy:#5fe0ff;--yl:#ffe14d;--pk:#ff5fd2;--gr:#7dff8a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Mont;color:var(--paper)}

/* world: sunset coast city (own art) — sky, far skyline, palms layer, road */
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#0d0730 0%,#2b0f5c 30%,#7a1f7a 46%,#ff4f8a 56%,#ff9a5c 62%,#ffd07a 66%,#2b1450 66.4%,#1c0d3a 100%)}
#sun{position:absolute;left:290px;top:820px;width:500px;height:500px;border-radius:50%;background:repeating-linear-gradient(180deg,#ffe07a 0 34px,#ff8a5c 34px 40px);clip-path:inset(0 0 52% 0);will-change:transform}
#sky2{position:absolute;left:-700px;top:520px;width:3400px;height:760px;will-change:transform}
#palms{position:absolute;left:-700px;top:560px;width:3400px;height:760px;will-change:transform}
#road{position:absolute;left:0;top:1275px;width:1080px;height:650px;background:linear-gradient(180deg,#2a2346 0%,#1a1530 100%)}
#lines{position:absolute;left:-700px;top:1290px;width:3400px;height:20px;will-change:transform;background:repeating-linear-gradient(90deg,#ffd34d 0 90px,transparent 90px 200px)}
.star{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff}
.blob{position:absolute;width:1240px;height:1240px;border-radius:50%;will-change:transform}
#blob1{left:-500px;top:-120px;background:radial-gradient(closest-side,rgba(255,95,176,.16) 0%,rgba(255,95,176,.05) 45%,rgba(255,95,176,0) 100%)}
#blob2{left:320px;top:860px;background:radial-gradient(closest-side,rgba(95,224,255,.10) 0%,rgba(95,224,255,.03) 45%,rgba(95,224,255,0) 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(90% 62% at 50% 46%,transparent 55%,rgba(8,0,20,.6) 100%)}
#shake{position:absolute;inset:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 860px;will-change:transform}
.scene *{position:absolute}
#cap{position:absolute;left:90px;top:1338px;width:900px;height:240px}
.chunk{position:absolute;left:0;top:0;width:900px;text-align:center;font:900 80px/1.06 Mont;text-transform:uppercase;letter-spacing:-1px;display:none;transform-origin:50% 40%}
.chunk span{display:inline-block;margin:0 11px;color:#fff;-webkit-text-stroke:18px #040705;paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.55)}
.chunk span.on{color:#ffd34d}
.cam{left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.scene .nb-panel{border-left-color:var(--acc);border-color:rgba(255,95,176,.4);background:linear-gradient(180deg,rgba(40,16,64,.95),rgba(24,8,40,.95))}
.scene .nb-chip{border-color:rgba(255,95,176,.8);background:rgba(30,10,50,.93)}
.chipL{height:96px;padding:0 44px;font:700 46px/90px JB;letter-spacing:4px;color:#ffd34d;text-align:center;white-space:nowrap}
.panT{padding:18px 40px 20px 46px;font:800 36px/1.24 Mont;color:var(--paper);white-space:nowrap}
.panT b{position:static;color:#ffd34d;font-weight:900}
.big{font:900 170px/1 Unb;color:#fff;-webkit-text-stroke:16px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.big i,.lbl i{position:static;font-style:normal;color:#ffd34d}
.lbl{font:900 92px/1 Unb;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.shd{border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0))}
.conf{width:18px;height:28px;border-radius:4px}
.spark{width:36px;height:36px;background:#ffe14d;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.stt{border-radius:30px;text-align:center;background:rgba(40,6,14,.92);white-space:nowrap;border:16px solid var(--red);color:var(--red);font:900 120px/170px Unb;padding:0 40px}
.stt.g{border-color:#7dff8a;color:#7dff8a;background:rgba(6,30,14,.92)}
.mm{width:380px;height:380px}
/* A — hook (3D) */
.a-t{left:0;top:230px;width:1080px}
.a-n{left:0;top:420px;width:1080px;font-size:84px;-webkit-text-stroke:12px var(--ink)}
/* B — 2013 -> today */
.b-cal{left:300px;top:330px;width:480px;height:554px}
.b-yr{left:0;top:200px;width:1080px;font-size:120px}
.b-m{left:350px;top:860px}
.b-beard{left:470px;top:1070px;width:140px;height:230px;transform-origin:70px 0}
/* C — phones pile */
.c-m{left:60px;top:880px}
.c-ph{width:150px;height:270px}
.c-chip{left:560px;top:300px}
/* D — question */
.d-q{left:0;top:250px;width:1080px;font-size:64px;line-height:1.2;-webkit-text-stroke:11px var(--ink)}
.d-chip{left:150px;top:560px}
.d-gp{left:560px;top:850px;width:420px;height:260px}
.d-m{left:90px;top:800px}
/* E — trailer in the city (3D) */
.e-n{left:0;top:200px;width:1080px;font-size:118px}
.e-l{left:0;top:340px;width:1080px;font-size:64px}
.e-chip{left:60px;top:440px}
/* F — record */
.f-c1{left:190px;top:420px;width:240px;height:820px}
.f-c2{left:640px;top:420px;width:240px;height:820px}
.f-l1{left:110px;top:1060px;width:400px;text-align:center;font:900 46px/1.1 Unb;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
.f-l2{left:560px;top:1060px;width:400px;text-align:center;font:900 40px/1.1 Unb;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
.f-tv{left:160px;top:250px;width:300px;height:220px}
.f-pop{left:650px;top:500px;width:220px;height:260px}
.f-crown{left:250px;top:150px}
.f-m{left:380px;top:760px;width:330px;height:330px}
.f-src{left:60px;top:200px}
/* G — delays */
.g-cal{width:280px;height:323px}
.g-st{font-size:38px;line-height:76px;padding:0 10px;border-width:9px;border-radius:20px}
.g-sn{left:120px;top:1130px;width:200px;height:160px}
.g-m{left:640px;top:880px;width:360px;height:360px}
/* H — verdict */
.h-q{left:0;top:240px;width:1080px;font-size:58px;-webkit-text-stroke:10px var(--ink)}
.h-st{left:150px;top:420px;width:780px}
.h-m{left:350px;top:820px}
.h-c1{left:60px;top:780px;width:250px;height:250px}
.h-c2{left:770px;top:780px;width:250px;height:250px}
/* I — download */
.i-bar{left:110px;top:520px;width:860px;height:110px;border-radius:55px;background:#1d1838;border:10px solid var(--ink);overflow:hidden}
.i-fill{left:0;top:0;width:100%;height:100%;background:linear-gradient(90deg,#5fe0ff,#ff5fb0);transform-origin:0 50%}
.i-n{left:0;top:270px;width:1080px;font-size:150px}
.i-l{left:0;top:660px;width:1080px;font-size:58px}
.i-bed{left:300px;top:860px;width:520px;height:390px}
.i-m{left:380px;top:770px;width:330px;height:330px}
.i-moon{left:780px;top:170px;width:180px;height:180px}
.i-z{font:900 80px/1 Unb;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
/* J — question */
.j-gp{left:540px;top:860px;width:440px;height:272px}
.j-q{left:0;top:260px;width:1080px;font-size:96px;line-height:1.15}
.j-m{left:90px;top:860px}
.j-qm{left:760px;top:600px;font:900 220px/1 Unb;color:#ffd34d;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill}
</style></head>
<body>
<div id="stage">
  <div id="bg"><div id="sun"></div><div id="stars"></div><div id="sky2"></div><div id="palms"></div><div id="road"></div><div id="lines"></div><div class="blob" id="blob1"></div><div class="blob" id="blob2"></div></div>
  <div id="shake">
<div id="A" class="scene"><div class="cam a-cam"></div><div class="a-t big">GTA <i>6</i></div><div class="a-n big">ЖДАЛИ <i>13</i> ЛЕТ</div></div>
<div id="B" class="scene"><div class="cam"><div class="b-yr big"><i class="yr">2013</i></div><div class="b-cal"></div><div class="shd" style="left:370px;top:1210px;width:340px;height:60px"></div><div class="b-m mm"></div><div class="b-beard"></div></div></div>
<div id="C" class="scene"><div class="cam"><div class="c-pile"></div><div class="shd" style="left:80px;top:1220px;width:340px;height:60px"></div><div class="c-m mm"></div></div></div>
<div id="D" class="scene"><div class="cam"><div class="d-q big">САМАЯ <i>ОЖИДАЕМАЯ</i><br>ИГРА?</div><div class="d-chip nb-chip chipL">БАЙТ ИЛИ НЕ БАЙТ?</div><div class="shd" style="left:600px;top:1100px;width:340px;height:50px"></div><div class="d-gp"></div><div class="shd" style="left:110px;top:1210px;width:340px;height:60px"></div><div class="d-m mm"></div></div></div>
<div id="E" class="scene"><div class="cam e-cam"></div><div class="e-n big"><span class="cnt" style="position:static">0</span></div><div class="e-l lbl">ПРОСМОТРОВ ЗА <i>СУТКИ</i></div><div class="e-chip nb-chip chipL">ТРЕЙЛЕР №2</div></div>
<div id="F" class="scene"><div class="cam"><div class="f-c1"></div><div class="f-c2"></div><div class="f-l1">ТРЕЙЛЕР<br>GTA 6</div><div class="f-l2">«ДЭДПУЛ<br>И РОСОМАХА»</div><div class="f-pop"></div><div class="f-crown">👑</div><div class="f-m mm"></div></div></div>
<div id="G" class="scene"><div class="cam g-cam"><div class="g-sn"></div><div class="shd" style="left:660px;top:1200px;width:320px;height:56px"></div><div class="g-m mm"></div></div></div>
<div id="H" class="scene"><div class="cam"><div class="h-c1"></div><div class="h-c2"></div><div class="shd" style="left:370px;top:1170px;width:340px;height:60px"></div><div class="h-m mm"></div><div class="h-q big">САМАЯ <i>ОЖИДАЕМАЯ?</i></div><div class="h-st stt g">НЕ БАЙТ</div><div class="v-fx"></div></div></div>
<div id="I" class="scene"><div class="cam"><div class="i-moon"></div><div class="i-n big"><span class="gb" style="position:static">0</span> <i>ГБ</i></div><div class="i-bar"><div class="i-fill"></div></div><div class="i-l lbl">ЗАГРУЗКА…</div><div class="i-bed"></div><div class="i-m mm"></div><div class="zz"></div></div></div>
<div id="J" class="scene"><div class="cam"><div class="j-q big">А ТЫ УЖЕ<br><i>КАЧАЕШЬ?</i></div><div class="shd" style="left:580px;top:1120px;width:360px;height:50px"></div><div class="j-gp"></div><div class="j-qm">?</div><div class="shd" style="left:110px;top:1210px;width:340px;height:60px"></div><div class="j-m mm"></div></div></div>
<div id="A2" class="scene"></div>
  </div>
  <div id="vig"></div>
  <div id="cap"></div>
</div>
<script src="timing.js"></script>
<script src="env.js"></script>
<script src="engine.js"></script>
<script src="mascot.js"></script>
<script src="props.js"></script>
<script src="world3d.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
</body></html>
