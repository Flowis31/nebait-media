<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>short</title>
<style>
@font-face{font-family:Unb;src:url(fonts/Unb.ttf);font-weight:200 900}
@font-face{font-family:PF;src:url(fonts/PF.ttf);font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(fonts/PFi.ttf);font-weight:400 900;font-style:italic}
@font-face{font-family:JB;src:url(fonts/JB.ttf);font-weight:100 800}
@font-face{font-family:Mont;src:url(fonts/Mont.ttf);font-weight:100 900}
:root{--ink:#0a130d;--bg:#0b2224;--acc:#b8ff3d;--accd:#74c81c;--paper:#f4ecd9;--red:#ff3b5c;--dim:#8fa698;--line:#24382c;--amb:#ffb84d;--cy:#5fe0ff;--pk:#ff5fa2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Mont;color:var(--paper)}
/* world: inside a metro car — tunnel lamps streaming behind the windows (far), car wall + bench (mid), handrail poles (near) */
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#0e2a2c 0%,#0b2224 60%,#081718 100%)}
#tun{position:absolute;left:0;top:330px;width:3600px;height:420px;will-change:transform}
#wall{position:absolute;left:-700px;top:80px;width:3400px;height:1300px;will-change:transform}
#floor{position:absolute;left:-700px;top:1320px;width:3400px;height:600px;will-change:transform;background:linear-gradient(180deg,#14292b,#0a1516);}
#floor:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 8px,transparent 8px 200px)}
#poles{position:absolute;left:-700px;top:60px;width:3400px;height:1300px;will-change:transform;opacity:.92}
.blob{position:absolute;width:1240px;height:1240px;border-radius:50%;will-change:transform}
#blob1{left:-500px;top:-120px;background:radial-gradient(closest-side,rgba(255,184,77,.14) 0%,rgba(255,184,77,.05) 45%,rgba(255,184,77,0) 100%)}
#blob2{left:320px;top:860px;background:radial-gradient(closest-side,rgba(95,224,255,.10) 0%,rgba(95,224,255,.04) 45%,rgba(95,224,255,0) 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(90% 62% at 50% 46%,transparent 55%,rgba(0,0,0,.6) 100%)}
#shake{position:absolute;inset:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 860px;will-change:transform}
.scene *{position:absolute}
#cap{position:absolute;left:90px;top:1338px;width:900px;height:240px}
.chunk{position:absolute;left:0;top:0;width:900px;text-align:center;font:900 80px/1.06 Mont;text-transform:uppercase;letter-spacing:-1px;display:none;transform-origin:50% 40%}
.chunk span{display:inline-block;margin:0 11px;color:#fff;-webkit-text-stroke:18px #040705;paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.55)}
.chunk span.on{color:var(--acc)}
/* shared */
.cam{left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.nb-panel.y{border-left-color:var(--amb);border-color:rgba(255,184,77,.35);background:linear-gradient(180deg,rgba(18,48,50,.95),rgba(8,24,26,.95))}
.nb-chip.y{border-color:rgba(255,184,77,.6);background:rgba(8,24,26,.92)}
.nb-chip.c{border-color:rgba(95,224,255,.6);background:rgba(8,24,26,.92)}
.nb-chip.r{border-color:rgba(255,59,92,.65);background:rgba(30,8,12,.92)}
.chipL{height:96px;padding:0 44px;font:700 46px/90px JB;letter-spacing:5px;color:var(--amb);text-align:center;white-space:nowrap}
.chipL.c{color:var(--cy)}.chipL.r{color:#ff6b80}.chipL.p{color:var(--pk)}.chipL.g{color:var(--acc)}
.panT{padding:18px 40px 20px 46px;font:800 42px/1.24 Mont;color:var(--paper);white-space:nowrap}
.panT b{position:static;color:var(--amb);font-weight:900}
.big{font:900 300px/1 Unb;color:#fff;-webkit-text-stroke:16px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.big i,.lbl i{position:static;font-style:normal;color:var(--amb)}
.lbl{font:900 64px/1 Unb;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.shd{border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));transform-origin:center}
.m{width:380px;height:380px}
.eb{width:150px;height:150px}
.board{border-radius:44px;background:linear-gradient(180deg,rgba(6,20,22,.93),rgba(4,12,14,.95));border:6px solid rgba(95,224,255,.25);box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.06)}
.board:before{content:'';position:absolute;left:30px;right:30px;top:50%;height:4px;background:rgba(255,255,255,.08)}
.stt{border-radius:30px;text-align:center;background:rgba(6,18,10,.92);white-space:nowrap}
.conf{width:18px;height:28px;border-radius:4px}
.spark{width:36px;height:36px;background:#ffe14d;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.puff{width:70px;height:70px;border-radius:50%;background:radial-gradient(closest-side,rgba(220,225,235,.85),rgba(220,225,235,0))}
.qm{font:900 120px/1 Unb;color:var(--amb);-webkit-text-stroke:12px var(--ink);paint-order:stroke fill}
.bla{width:210px;height:140px}
.ring{border-radius:50%;border:8px solid var(--amb);opacity:0}
.card{width:270px;height:330px;border-radius:30px}
.card .ic{left:45px;top:26px;width:180px;height:180px}
.card .mt{left:20px;top:236px;width:230px;height:40px}
.card .ck{left:190px;top:-30px;width:100px;height:100px}
/* A — hook */
.a-chip{left:40px;top:160px}
.a-n{left:0;top:250px;width:1080px}
.a-u{left:0;top:570px;width:1080px;height:80px;overflow:hidden}
.a-u div{left:0;top:6px;width:1080px}
.a-eb{left:90px;top:700px;width:580px;height:580px}
.a-m{left:640px;top:900px;width:390px;height:390px}
.a-src{left:600px;top:690px}
.a-shd1{left:80px;top:1230px;width:520px;height:80px}.a-shd2{left:660px;top:1250px;width:350px;height:70px}
.a-bla{left:700px;top:700px}
/* B — the metro, the hum disappears */
.b-wave{left:40px;top:330px;width:1000px;height:400px}
.b-m{left:340px;top:770px;width:390px;height:390px}
.b-eb{left:620px;top:840px}
.b-chip{left:330px;top:220px}
.b-shd{left:360px;top:1130px;width:360px;height:60px}
/* C — the neighbour */
.c-p{left:30px;top:650px;width:400px;height:480px}
.c-ph{left:318px;top:700px;width:96px;height:183px}
.c-m{left:640px;top:780px;width:380px;height:380px}
.c-eb{left:610px;top:850px;width:140px;height:140px}
.c-shd1{left:40px;top:1110px;width:400px;height:60px}.c-shd2{left:660px;top:1140px;width:340px;height:60px}
/* D, E — the wave board */
.d-board,.e-board{left:40px;top:200px;width:1000px;height:740px}
.d-hum,.e-voice{left:40px;top:200px;width:1000px;height:740px}
.d-anti,.e-anti,.e-sum{left:40px;top:200px;width:1000px;height:740px}
.d-chip,.e-chip{left:80px;top:230px}
.d-chip2,.e-chip2{left:80px;top:830px}
.d-eb,.e-eb{left:110px;top:960px;width:300px;height:300px}
.d-m,.e-m{left:640px;top:900px;width:380px;height:380px}
.d-shd1,.e-shd1{left:120px;top:1240px;width:300px;height:50px}.d-shd2,.e-shd2{left:660px;top:1250px;width:340px;height:60px}
.d-beam,.e-beam{left:0;top:0;width:1080px;height:1300px}
.e-x{left:830px;top:560px;width:150px;height:150px}
.e-clock{left:820px;top:240px}
/* F — joke: the kitchen, the turtle and the fly */
.f-bg{left:-100px;top:-100px;width:1280px;height:2120px}
.f-t{left:40px;top:960px;width:380px;height:253px}
.f-m{left:560px;top:830px;width:390px;height:390px}
.f-sw{left:420px;top:560px;width:180px;height:432px;transform-origin:90px 414px}
.f-fly{left:140px;top:860px;width:110px;height:92px}
.f-trail{left:0;top:0;width:1080px;height:1300px}
.f-shd1{left:60px;top:1180px;width:340px;height:50px}.f-shd2{left:600px;top:1190px;width:320px;height:60px}
/* G — proof: Sony's manual */
.g-src{left:40px;top:200px}
.g-eb{left:260px;top:430px;width:360px;height:360px}
.g-m{left:660px;top:470px;width:340px;height:340px}
.g-c1{left:40px;top:880px}.g-c2{left:405px;top:880px}.g-c3{left:770px;top:880px}
.g-weak{left:590px;top:790px}
.g-shd{left:280px;top:770px;width:330px;height:50px}
/* R — the ear: the tip holds the voice */
.r-ear{left:-60px;top:260px;width:1100px;height:856px}
.r-eb{left:170px;top:548px;width:400px;height:400px}
.r-chipI{left:60px;top:200px;width:170px;height:170px}
.r-xI{left:170px;top:190px;width:90px;height:90px}
.r-lab{left:280px;top:226px}
.r-tip{left:440px;top:930px}
.r-m{left:740px;top:870px;width:330px;height:330px}
/* H — the answer, НЕ БАЙТ, the takeaway, subscribe, loop */
.h-p{left:30px;top:700px;width:330px;height:396px}
.h-ph{left:262px;top:742px;width:80px;height:152px}
.h-m{left:660px;top:830px;width:370px;height:370px}
.h-eb{left:630px;top:900px;width:130px;height:130px}
.h-st{left:240px;top:250px;width:600px;height:180px;border:18px solid var(--acc);color:var(--acc);font:900 104px/144px Unb}
.h-r1{left:300px;top:520px}.h-r2{left:300px;top:640px}
.h-mt1{left:560px;top:530px;width:400px;height:70px}.h-mt2{left:560px;top:650px;width:400px;height:70px}
.h-tS{left:60px;top:480px;width:260px;height:260px}.h-tM{left:290px;top:460px;width:290px;height:290px}.h-tL{left:560px;top:430px;width:330px;height:330px}
.h-ok{left:820px;top:560px;width:130px;height:130px}
.h-sub{left:220px;top:1150px;width:660px;height:150px;border-radius:80px;background:linear-gradient(180deg,#ff4f6b,#e3243f);border:10px solid var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.5);font:900 54px/130px Unb;color:#fff;text-align:left;padding-left:160px}
.h-bell{left:40px;top:12px;width:110px;height:110px}
.h-shd1{left:40px;top:1080px;width:330px;height:50px}.h-shd2{left:680px;top:1180px;width:330px;height:60px}
.h-fx{left:0;top:0}
</style></head>
<body>
<div id="stage">
  <div id="bg"><div id="tun"></div><div id="wall"></div><div id="floor"></div><div id="poles"></div><div class="blob" id="blob1"></div><div class="blob" id="blob2"></div></div>
  <div id="shake">
<div id="A" class="scene"><div class="cam"><div class="shd a-shd1"></div><div class="shd a-shd2"></div><div class="a-eb"></div><div class="m a-m"></div><div class="a-n big"><i>200</i></div><div class="a-u"><div class="lbl a-u1">РАЗ В СЕКУНДУ</div><div class="lbl a-u2">А СОСЕДА — <i>НЕТ?</i></div></div><div class="a-src nb-panel y panT"><b>Apple</b> · 28.10.2019</div><div class="a-chip nb-chip y chipL">ЧАСТЬ 2</div></div></div>
<div id="B" class="scene"><div class="cam"><div class="b-wave"></div><div class="shd b-shd"></div><div class="m b-m"></div><div class="eb b-eb"></div><div class="b-chip nb-chip c chipL c">ШУМОДАВ: ВКЛ</div></div></div>
<div id="C" class="scene"><div class="cam"><div class="shd c-shd1"></div><div class="shd c-shd2"></div><div class="c-p"></div><div class="c-ph"></div><div class="m c-m"></div><div class="c-eb"></div></div></div>
<div id="D" class="scene"><div class="cam"><div class="board d-board"></div><div class="d-hum"></div><div class="d-anti"></div><div class="d-beam"></div><div class="d-chip nb-chip y chipL">ГУЛ</div><div class="d-chip2 nb-chip c chipL c">НАОБОРОТ</div><div class="shd d-shd1"></div><div class="shd d-shd2"></div><div class="d-eb"></div><div class="m d-m"></div></div></div>
<div id="E" class="scene"><div class="cam"><div class="board e-board"></div><div class="e-voice"></div><div class="e-anti"></div><div class="e-sum"></div><div class="e-chip nb-chip p chipL p">ГОЛОС</div><div class="e-chip2 nb-chip c chipL c">ОПОЗДАЛ</div><div class="shd e-shd1"></div><div class="shd e-shd2"></div><div class="e-eb"></div><div class="m e-m"></div><div class="e-x"></div></div></div>
<div id="F" class="scene"><div class="f-bg"></div><div class="cam"><div class="shd f-shd1"></div><div class="shd f-shd2"></div><div class="f-t"></div><div class="f-trail"></div><div class="m f-m"></div><div class="f-sw"></div><div class="f-fly"></div></div></div>
<div id="G" class="scene"><div class="cam"><div class="g-src nb-panel y panT"><b>Sony</b> · инструкция к наушникам<br>WF-1000XM4, Help Guide</div><div class="shd g-shd"></div><div class="g-eb"></div><div class="m g-m"></div>
  <div class="card nb-panel y g-c1"><div class="ic"></div><div class="mt"></div><div class="ck"></div></div><div class="card nb-panel y g-c2"><div class="ic"></div><div class="mt"></div><div class="ck"></div></div><div class="card nb-panel red g-c3"><div class="ic"></div><div class="mt"></div></div>
  <div class="g-weak nb-chip r chipL r">СЛАБЕЕ</div></div></div>
<div id="R" class="scene"><div class="cam"><div class="r-ear"></div><div class="r-eb"></div><div class="r-chipI"></div><div class="r-xI"></div><div class="r-lab nb-chip chipL">НЕ ЭЛЕКТРОНИКА</div><div class="r-tip nb-chip y chipL">НАСАДКА</div><div class="m r-m"></div></div></div>
<div id="H" class="scene"><div class="cam"><div class="shd h-shd1"></div><div class="shd h-shd2"></div><div class="h-p"></div><div class="h-ph"></div><div class="m h-m"></div><div class="h-eb"></div>
  <div class="h-r1 nb-chip y chipL">ГУЛ</div><div class="h-r2 nb-chip p chipL p">ГОЛОС</div><div class="h-mt1"></div><div class="h-mt2"></div>
  <div class="h-tS"></div><div class="h-tM"></div><div class="h-tL"></div><div class="h-ok"></div>
  <div class="h-st stt">НЕ БАЙТ</div><div class="h-sub">ПОДПИШИСЬ<div class="h-bell"></div></div><div class="h-fx"></div></div></div>
<div id="A2" class="scene"></div>
  </div>
  <div id="vig"></div>
  <div id="cap"></div>
</div>
<script src="timing.js"></script>
<script src="env.js"></script>
<script src="engine.js"></script>
<script src="mascot.js"></script>
<script src="props.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
</body></html>
