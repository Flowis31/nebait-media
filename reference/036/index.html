<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>short</title>
<style>
@font-face{font-family:Unb;src:url(fonts/Unb.ttf);font-weight:200 900}
@font-face{font-family:PF;src:url(fonts/PF.ttf);font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(fonts/PFi.ttf);font-weight:400 900;font-style:italic}
@font-face{font-family:JB;src:url(fonts/JB.ttf);font-weight:100 800}
@font-face{font-family:Mont;src:url(fonts/Mont.ttf);font-weight:100 900}
:root{--ink:#0a130d;--bg:#1c0d12;--acc:#ffb84d;--accd:#d8862a;--paper:#f4ecd9;--red:#ff3b5c;--cy:#5fe0ff;--yl:#ffe14d;--pk:#ff5fd2;--gr:#7dff8a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Mont;color:var(--paper)}
/* world: a night library */
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#140810 0%,#2a1218 55%,#1c0d12 100%)}
#far{position:absolute;left:-700px;top:-40px;width:3400px;height:1400px;will-change:transform;opacity:.75}
#lamps{position:absolute;left:-700px;top:0;width:3400px;height:1200px;will-change:transform}
#mid{position:absolute;left:-700px;top:-60px;width:3400px;height:1400px;will-change:transform}
#floor{position:absolute;left:0;top:1240px;width:1080px;height:630px;background:linear-gradient(180deg,#5a3018 0%,#3a1e10 40%,#1c0d08 100%)}
#planks{position:absolute;left:-700px;top:1240px;width:3400px;height:630px;will-change:transform;background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 236px,rgba(0,0,0,.35) 236px 242px)}
#rug{position:absolute;left:140px;top:1250px;width:800px;height:120px;border-radius:50%;background:radial-gradient(closest-side,#8a2a3a 0%,#6a1a2a 70%,rgba(106,26,42,0) 100%);will-change:transform}
#motes{position:absolute;inset:0}
.mote{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(255,220,160,.55);will-change:transform}
.blob{position:absolute;width:1240px;height:1240px;border-radius:50%;will-change:transform}
#blob1{left:-500px;top:-120px;background:radial-gradient(closest-side,rgba(255,184,77,.14) 0%,rgba(255,184,77,.05) 45%,rgba(255,184,77,0) 100%)}
#blob2{left:320px;top:860px;background:radial-gradient(closest-side,rgba(95,224,255,.10) 0%,rgba(95,224,255,.03) 45%,rgba(95,224,255,0) 100%)}
#vig{position:absolute;inset:0;background:radial-gradient(90% 62% at 50% 46%,transparent 55%,rgba(10,0,6,.6) 100%)}
#shake{position:absolute;inset:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 860px;will-change:transform}
.scene *{position:absolute}
#cap{position:absolute;left:90px;top:1338px;width:900px;height:240px}
.chunk{position:absolute;left:0;top:0;width:900px;text-align:center;font:900 80px/1.06 Mont;text-transform:uppercase;letter-spacing:-1px;display:none;transform-origin:50% 40%}
.chunk span{display:inline-block;margin:0 11px;color:#fff;-webkit-text-stroke:18px #040705;paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.55)}
.chunk span.on{color:var(--acc)}
/* shared */
.cam{left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.scene .nb-panel{border-left-color:var(--acc);border-color:rgba(255,184,77,.4);background:linear-gradient(180deg,rgba(44,20,26,.95),rgba(26,10,16,.95))}
.scene .nb-chip{border-color:rgba(255,184,77,.75);background:rgba(34,14,20,.93)}
.scene .nb-chip.r{border-color:rgba(255,59,92,.85)}
.chipL{height:96px;padding:0 44px;font:700 46px/90px JB;letter-spacing:4px;color:var(--acc);text-align:center;white-space:nowrap}
.chipL.r{color:#ff8a9a}
.panT{padding:18px 40px 20px 46px;font:800 36px/1.3 Mont;color:var(--paper);white-space:nowrap}
.panT b{position:static;color:var(--acc);font-weight:900}
.panT i{position:static;font-style:italic;color:#fff}
.big{font:900 150px/1 Unb;color:#fff;-webkit-text-stroke:16px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.big i{position:static;font-style:normal;color:var(--acc)}
.lbl{font:900 84px/1 Unb;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap}
.lbl i{position:static;font-style:normal;color:var(--acc)}
.shd{border-radius:50%;background:radial-gradient(closest-side,rgba(10,0,4,.62),rgba(10,0,4,0));transform-origin:center}
.stt{border-radius:30px;text-align:center;background:rgba(26,8,14,.92);white-space:nowrap}
.conf{width:18px;height:28px;border-radius:4px}
.spark{width:36px;height:36px;background:#ffe14d;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.qm{font:900 120px/1 Unb;color:var(--yl);-webkit-text-stroke:12px var(--ink);paint-order:stroke fill}
.ring{border:10px solid #fff;border-radius:50%}
.flash{left:0;top:0;width:1080px;height:1920px;background:#fff}
.slip{width:150px;height:54px;border-radius:10px;background:#f4ecd9;border:5px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.slip::after{content:'';position:absolute;left:16px;top:18px;width:96px;height:10px;border-radius:5px;background:#b9ad92}
.tick{border-radius:50%;background:var(--acc);border:3px solid var(--ink)}
.dot{font:900 64px/1 JB;color:var(--ink)}
.zz{font:900 70px/1 Unb;color:#cfe8ff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
/* A — hook */
.a-t{left:0;top:180px;width:1080px}
.a-f{left:90px;top:410px;width:900px;height:300px}
.a-lk{left:650px;top:800px;width:300px;height:375px}
.a-m{left:40px;top:800px;width:420px;height:420px}
.a-shd1{left:640px;top:1140px;width:320px;height:70px}.a-shd2{left:80px;top:1180px;width:340px;height:60px}
/* B — close: the padlock */
.b-lk{left:250px;top:330px;width:520px;height:650px}
.b-sw{left:740px;top:200px;width:280px;height:336px}
.b-m{left:0;top:930px;width:340px;height:340px}
.b-shd{left:260px;top:930px;width:500px;height:90px}
/* C — wide: the leak */
.c-safe{left:70px;top:250px;width:380px;height:397px}
.c-hit{width:340px;height:64px;border-radius:12px;background:#fff3c0;border:6px solid var(--ink);font:800 38px/52px JB;color:var(--ink);text-align:center}
.c-mag{left:0;top:0;width:260px;height:260px}
.c-m{left:720px;top:300px;width:320px;height:320px}
.c-src{left:40px;top:140px}
.c-shd{left:80px;top:610px;width:380px;height:60px}
/* D — brute force, wheel by wheel */
.d-lk{left:71px;top:400px;width:938px;height:600px}
.d-bot{left:680px;top:880px;width:330px;height:363px}
.d-m{left:10px;top:900px;width:340px;height:340px}
.d-chip{left:40px;top:180px}
.d-shd1{left:120px;top:960px;width:840px;height:90px}.d-shd2{left:700px;top:1210px;width:300px;height:50px}
/* E — joke: very long */
.e-bot{left:200px;top:370px;width:620px;height:682px}
.e-beard{left:350px;top:780px;width:320px;height:520px;transform-origin:160px 0}
.e-web{left:380px;top:370px;width:160px;height:160px}
.e-cal{width:170px;height:196px}
.e-sn{left:-260px;top:1120px;width:260px;height:179px}
.e-m{left:770px;top:930px;width:300px;height:300px}
.e-n{left:40px;top:170px}
/* F — wide: the library and the dictionary */
.f-shelf{left:90px;top:200px;width:900px;height:760px;overflow:hidden;border-radius:12px;border:12px solid #4a2a14;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.f-book{left:400px;top:420px;width:280px;height:373px}
.f-open{left:150px;top:640px;width:780px;height:509px}
.f-tab{width:300px;height:106px}
.f-bot{left:0;top:930px;width:260px;height:286px}
.f-m{left:800px;top:960px;width:280px;height:280px}
.f-shd{left:170px;top:1100px;width:740px;height:90px}
/* G — close: the page */
.g-book{left:10px;top:420px;width:1060px;height:691px}
.g-word{left:575px;top:742px;width:400px;height:64px;font:800 48px/64px JB;color:var(--ink);text-align:left;white-space:nowrap}
.g-band{left:566px;top:742px;width:400px;height:64px;background:#ffe14d;border-radius:8px;transform-origin:0 50%}
.g-hl{left:900px;top:380px;width:100px;height:350px;transform-origin:50px 350px}
.g-ck{left:860px;top:880px;width:150px;height:150px}
.g-m{left:0;top:960px;width:320px;height:320px}
.g-chip{left:40px;top:220px}
/* H — the dictionary attack: open in seconds */
.h-lk{left:71px;top:420px;width:938px;height:600px}
.h-tgt{left:105px;top:250px;width:870px;height:150px;font:800 52px/150px JB;color:var(--ink);text-align:left;white-space:nowrap;padding-left:6px}
.h-sec{left:0;top:270px;width:1080px}
.h-sw{left:800px;top:900px;width:240px;height:288px}
.h-bot{left:30px;top:930px;width:300px;height:330px}
.h-m{left:380px;top:960px;width:300px;height:300px}
.h-src{left:40px;top:130px}
.h-shd{left:120px;top:990px;width:840px;height:90px}
/* I — БАЙТ */
.i-st{left:240px;top:250px;width:600px;height:180px;border:18px solid var(--red);color:var(--red);font:900 120px/144px Unb}
.i-f{left:160px;top:520px;width:760px;height:253px}
.i-strike{left:150px;top:660px;width:780px;height:18px;border-radius:9px;background:var(--red);transform-origin:0 50%;border:4px solid var(--ink)}
.i-m{left:330px;top:800px;width:420px;height:420px}
.i-lk{left:800px;top:880px;width:240px;height:300px}
.i-shd{left:360px;top:1190px;width:360px;height:70px}
/* J — takeaway + question */
.j-f{left:90px;top:300px;width:900px;height:300px}
.j-n{left:0;top:650px;width:1080px;font-size:118px}
.j-meme{left:580px;top:850px}
.j-x{left:570px;top:890px;width:280px;height:16px;border-radius:8px;background:var(--red);border:4px solid var(--ink);transform-origin:0 50%}
.j-gb{left:720px;top:820px;width:260px;height:375px}
.j-m{left:40px;top:820px;width:420px;height:420px}
.j-shd1{left:80px;top:1190px;width:340px;height:60px}.j-shd2{left:730px;top:1170px;width:260px;height:50px}
.v-fx{left:0;top:0}
</style></head>
<body>
<div id="stage">
  <div id="bg"><div id="far"></div><div id="lamps"></div><div id="mid"></div><div id="floor"></div><div id="planks"></div><div id="rug"></div><div id="motes"></div><div class="blob" id="blob1"></div><div class="blob" id="blob2"></div></div>
  <div id="shake">
<div id="A" class="scene"><div class="cam"><div class="shd a-shd1"></div><div class="shd a-shd2"></div><div class="a-t big"><i>13</i> БУКВ</div><div class="a-f"></div><div class="a-lk"></div><div class="a-m mm"></div></div></div>
<div id="B" class="scene"><div class="cam"><div class="shd b-shd"></div><div class="b-lk"></div><div class="b-sw"></div><div class="b-m mm"></div></div></div>
<div id="C" class="scene"><div class="cam"><div class="shd c-shd"></div><div class="c-heap"></div><div class="c-safe"></div><div class="c-m mm"></div><div class="c-mag"></div><div class="c-src nb-panel panT"><b>NordPass</b>: пароли из утечек<br>17.11.2026</div></div></div>
<div id="D" class="scene"><div class="cam"><div class="shd d-shd1"></div><div class="shd d-shd2"></div><div class="d-lk"></div><div class="d-bot"></div><div class="d-m mm"></div><div class="d-chip nb-chip chipL">ПО ОДНОЙ БУКВЕ</div></div></div>
<div id="E" class="scene"><div class="cam"><div class="e-bot"></div><div class="e-beard"></div><div class="e-web"></div><div class="e-sn"></div><div class="e-m mm"></div><div class="e-n nb-chip chipL r">13 БУКВ ПЕРЕБОРОМ</div></div></div>
<div id="F" class="scene"><div class="cam"><div class="f-shelf"></div><div class="shd f-shd"></div><div class="f-open"></div><div class="f-book"></div><div class="f-bot"></div><div class="f-m mm"></div></div></div>
<div id="G" class="scene"><div class="cam"><div class="g-book"></div><div class="g-band"></div><div class="g-word">skibiditoilet</div><div class="g-hl"></div><div class="g-ck"></div><div class="g-m mm"></div><div class="g-chip nb-chip chipL">СЛОВАРЬ: МЕМЫ</div></div></div>
<div id="H" class="scene"><div class="cam"><div class="shd h-shd"></div><div class="h-lk"></div><div class="h-tgt">skibiditoilet</div><div class="h-sec lbl">ЗА <i>СЕКУНДЫ</i></div><div class="h-sw"></div><div class="h-bot"></div><div class="h-m mm"></div>
  <div class="h-src nb-panel panT"><b>NordPass</b>: <i>«could be cracked in seconds»</i></div></div></div>
<div id="I" class="scene"><div class="cam"><div class="shd i-shd"></div><div class="i-f"></div><div class="i-strike"></div><div class="i-lk"></div><div class="i-m mm"></div><div class="i-st stt">БАЙТ</div><div class="v-fx"></div></div></div>
<div id="J" class="scene"><div class="cam"><div class="shd j-shd1"></div><div class="shd j-shd2"></div><div class="j-f"></div><div class="j-n big"><i>15+</i> ЗНАКОВ</div><div class="j-meme nb-chip chipL r">МЕМЫ</div><div class="j-x"></div><div class="j-gb"></div><div class="j-m mm"></div></div></div>
<div id="A2" class="scene"></div>
  </div>
  <div id="vig"></div>
  <div id="cap"></div>
</div>
<script src="timing.js"></script>
<script src="env.js"></script>
<script src="engine.js"></script>
<script src="mascot.js"></script>
<script src="props.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
</body></html>
